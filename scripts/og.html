<!doctype html>
<html><head><meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #07080c; font-family: "Segoe UI", Arial, sans-serif; color: #edeef3; position: relative; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 56px 56px; -webkit-mask-image: radial-gradient(ellipse 80% 70% at 70% 40%, #000 30%, transparent 75%); }
  .glow { position: absolute; width: 700px; height: 500px; right: -120px; top: -160px; background: radial-gradient(closest-side, rgba(76,141,255,.45), rgba(151,113,255,.25) 50%, transparent); filter: blur(30px); }
  .wrap { position: absolute; inset: 0; padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .logo { width: 64px; height: 64px; border-radius: 16px; background: #edeef3; color: #07080c; display: grid; place-items: center; font: 700 24px Consolas, monospace; letter-spacing: -1px; }
  .eyebrow { font: 600 18px Consolas, monospace; letter-spacing: 5px; color: #4c8dff; text-transform: uppercase; }
  h1 { font-size: 76px; line-height: 1.02; margin: 18px 0 0; letter-spacing: -2.5px; font-weight: 700; }
  .g { background: linear-gradient(100deg, #4c8dff, #9771ff 60%, #38cdeb); -webkit-background-clip: text; color: transparent; }
  .foot { display: flex; justify-content: space-between; align-items: center; color: #9ca0b0; font-size: 22px; }
  .chips span { border: 1px solid #222430; border-radius: 999px; padding: 8px 18px; margin-left: 10px; background: rgba(13,14,20,.8); color: #edeef3; font-size: 19px; }
</style></head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <div class="wrap">
    <div class="logo">MD</div>
    <div>
      <div class="eyebrow">Manish Dabaria</div>
      <h1>Building <span class="g">Intelligent</span><br/>Solutions Through Code.</h1>
    </div>
    <div class="foot">
      <span>Full-Stack Developer · AI Engineer</span>
      <span class="chips"><span>React</span><span>Node.js</span><span>LLMs</span><span>RAG</span></span>
    </div>
  </div>
</body></html>
